[package]
name = "pg4findr"
version = "0.2.0-beta.1"
edition = "2024"
description = "Find G-quadruplex motifs in sequencing reads or genome assemblies"
license = "MIT"
repository = "https://github.com/artorias111/pg4findr"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "g-quadruplex", "fastx"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
flate2 = "1.1.5"
regex = "1.12.2"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
